repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Required spell-check (preferences: Codespell in every repo).
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # Required secret detection (preferences: Betterleaks in pre-commit).
  # No staged-only mode in betterleaks; scan the worktree (fail-closed).
  - repo: local
    hooks:
      - id: betterleaks
        name: betterleaks secrets
        entry: betterleaks dir .
        language: system
        pass_filenames: false
        always_run: true
